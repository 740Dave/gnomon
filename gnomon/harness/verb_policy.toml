# Gnomon VERB POLICY (the NEUTRAL default, shipped with the package). redirect 2.
#
# Read by gnomon/harness/verb_policy.py (stdlib tomllib).  This file names NO role: who may
# call a verb without confirming is deployment data.  Two files, in order, each merges onto this one
# PER VERB: the DEPLOYMENT file <deploy_root>/defaults/verb-policy.toml, then the MACHINE-CONFIG file
# <runtime_root>/verb-policy.toml.  A [verbs.<name>] table in either replaces that verb's WHOLE
# table here (so restate `always`, `warning` and every other key you still want), and a verb it
# does not mention keeps this file's entry.  An override cannot remove a verb; use `others = "deny"`
# to restrict one.  An override verb name that is not a real verb is reported as INVALID and
# ignored, and every override entry that narrows access is reported loudly at each launch.  A
# file that does not parse or validate disables the governed verbs loudly (no fallback to this
# file) and never breaks a launch.  Editing either file is the operator's call.
#
# Per verb:
#   always  = [ids]     always allowed
#   others  = "allow" | "confirm-twice" | "deny"     everyone not in `always`
#   warning = "..."     returned on the FIRST call of a confirm-twice verb ({verb} {target} {what})
#   confirm_window_seconds = N      optional (default 600, floor 10, ceiling 3600)
#   when    = [names]   optional, from the closed set of predicates implemented in code
#   [verbs.<name>.targets.<id>]     optional per-target override (any subset of the keys above)
#
# GUARD (tests/test_x30_verb_policy.py): every verb the harness exposes, enumerated from the
# code (self-verbs, hub MCP tools, operator commands), MUST have an entry here, even if it is
# just `others = "allow"`.  A new verb without an entry fails the suite, and must also be added to
# REQUIRED_VERBS in verb_policy.py.
#
# Only restart_service is routed through verb_policy.check() today; every other entry below is
# `allow`, which is exactly the behaviour those verbs have now (unchanged).

schema = 1

# --- the real entry: restart a registered service (D52) ------------------------------------
# NOBODY is allowlisted by default (the most restrictive neutral choice): every caller may call it,
# but the first call only returns the warning; a second call with an `ack` reason inside the
# window proceeds.  A deployment names its allowlist in its own verb-policy file.  With
# confirm-twice the tool is VISIBLE to every harnessed session when restart_service is ON;
# only `deny` hides it.
[verbs.restart_service]
always = []
others = "confirm-twice"
warning = "You're not on the allowlist for {what} and making this call can interrupt in-progress work.  If you have a legitimate need to restart this service, coordinate the restart timing with everyone present who would be affected (people and agents) and then call this verb a second time."
confirm_window_seconds = 600

